<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Studio Iosi Pratama</title>
  <meta content="Iosi Pratama founded design studio, dedicated to crafting simple and beautiful apps." name="description">
  <meta content="Studio Iosi Pratama" property="og:title">
  <meta content="Iosi Pratama founded design studio, dedicated to crafting simple and beautiful apps." property="og:description">
  <meta content="https://studio.iosipratama.com/images/open-graph.jpg" property="og:image">
  <meta content="Studio Iosi Pratama" property="twitter:title">
  <meta content="Iosi Pratama founded design studio, dedicated to crafting simple and beautiful apps." property="twitter:description">
  <meta content="https://studio.iosipratama.com/images/open-graph.jpg" property="twitter:image">
  <meta property="og:type" content="website">
  <meta content="summary_large_image" name="twitter:card">
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <link href="dist/output.css" rel="stylesheet">
  <link href="css/theme.css" rel="stylesheet">
  <link href="images/favicon.png" rel="shortcut icon" type="image/x-icon">
  <link href="images/webclip.png" rel="apple-touch-icon">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center" style="background: var(--bg); color: var(--fg);">
  <div class="max-w-2xl w-full mx-auto mt-24 p-8 rounded-xl animate-fadeIn">
    <img src="images/computer-3d.png" alt="computer" class="h-[120px] mb-4" />
      <div class="flex items-center gap-2 animate-fadeIn mb-2">
        <span class="text-base font-semibold tracking-tight" style="opacity: 0.6; color: var(--fg-muted);">Studio</span>
        <img src="images/iosipratama.svg" alt="Iosi Pratama Logo" class="h-8 align-middle logo-light" />
        <img src="images/iosipratama-dark.svg" alt="Iosi Pratama Logo Dark" class="h-8 align-middle logo-dark" />
      </div>
      <p class="text-[28px] animate-fadeIn delay-100 mb-8" style="font-family: 'PPEditorialNew-Regular', serif; color: var(--fg);">a small studio making <span id="animated-word" style="border-right: 2px solid; border-color: var(--fg); padding-right:2px;"></span><span style="font-style: italic; opacity: 0.2; color: var(--fg-light);"> that feel right.</span> 🍃</p>
      <div class="mb-1 animate-fadeIn delay-200">
        <div class="uppercase text-xs font-bold tracking-wider mb-2" style="opacity: 0.4; color: var(--fg-light);">Links</div>
        <div class="text-base mb-8">
          <a href="https://iosipratama.notion.site/Work-at-Studio-Iosi-Pratama-Career-Page-091d862d65c34aa68af86571e6733815" target="_blank" class="text-xl link-muted">Careers</a>
        </div>
      </div>
      <div class="animate-fadeIn delay-300">
        <p class="text-base mb-1" style="opacity: 0.4; color: var(--fg-light);">© 2023 PT Studio Iosi Pratama</p>
        <a href="https://www.linkedin.com/company/studio-iosi-pratama/?viewAsMember=true" target="_blank" class="text-base hover:opacity-60 transition-colors" style="opacity: 0.4; color: var(--fg-light);">Linkedin</a>
      </div>
      <!-- Theme Toggle Button -->
      <div class="flex justify-left mt-6 animate-fadeIn delay-400">
        <button id="theme-toggle" aria-label="Toggle dark/light mode" style="background: none; border: none; cursor: pointer; outline: none; transition: filter 0.3s;">
          <img id="theme-icon" src="images/moon.svg" alt="Toggle theme" class="h-7 w-7 transition-all duration-300" />
        </button>
      </div>
      

  </div>
  <script src="https://d3e54v103j8qbb.cloudfront.net/js/jquery-3.5.1.min.dc5e7f18c8.js?site=64e6e4a6ec64fc6b7763d5e5" type="text/javascript" crossorigin="anonymous"></script>
  <script src="js/studio-iosi-pratama-2356d5378639523f059.js" type="text/javascript"></script>
  <script>
    const words = ["ios apps", "designs", "software", "websites"];
    const el = document.getElementById("animated-word");
    let wordIndex = 0;
    let charIndex = 0;
    let isDeleting = false;
    let typingSpeed = 90;
    let erasingSpeed = 60;
    let delayBetweenWords = 1200;

    function type() {
      const currentWord = words[wordIndex];
      if (!isDeleting) {
        el.textContent = currentWord.substring(0, charIndex + 1);
        charIndex++;
        if (charIndex === currentWord.length) {
          isDeleting = true;
          setTimeout(type, delayBetweenWords);
        } else {
          setTimeout(type, typingSpeed);
        }
      } else {
        el.textContent = currentWord.substring(0, charIndex - 1);
        charIndex--;
        if (charIndex === 0) {
          isDeleting = false;
          wordIndex = (wordIndex + 1) % words.length;
          setTimeout(type, 400);
        } else {
          setTimeout(type, erasingSpeed);
        }
      }
    }
    // Start animation after DOM is ready
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(type, 600);
      // Theme toggle logic
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const themeToggle = document.getElementById('theme-toggle');
      const themeIcon = document.getElementById('theme-icon');
      const logoLight = document.querySelector('.logo-light');
      const logoDark = document.querySelector('.logo-dark');
      const root = document.documentElement;

      function setTheme(mode, save = true) {
        if (mode === 'dark') {
          root.style.setProperty('--bg', '#18181b');
          root.style.setProperty('--card-bg', '#232329');
          root.style.setProperty('--fg', '#fafaf9');
          root.style.setProperty('--fg-light', '#d4d4d8');
          root.style.setProperty('--fg-muted', '#a1a1aa');
          themeIcon.src = 'images/sun.svg';
          document.body.classList.add('theme-dark');
        } else {
          root.style.setProperty('--bg', '#fafaf9');
          root.style.setProperty('--card-bg', '#fff');
          root.style.setProperty('--fg', '#18181b');
          root.style.setProperty('--fg-light', '#a1a1aa');
          root.style.setProperty('--fg-muted', '#52525b');
          themeIcon.src = 'images/moon.svg';
          document.body.classList.remove('theme-dark');
        }
        document.body.classList.add('theme-transition');
        setTimeout(() => document.body.classList.remove('theme-transition'), 400);
        if (save) localStorage.setItem('theme', mode);
      }

      // Initial theme
      let theme = localStorage.getItem('theme');
      if (!theme) theme = prefersDark ? 'dark' : 'light';
      setTheme(theme, false);

      themeToggle.addEventListener('click', () => {
        theme = (theme === 'dark') ? 'light' : 'dark';
        setTheme(theme);
      });
    });
  </script>
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn { animation: fadeIn 1s both; }
    .delay-100 { animation-delay: 0.1s; }
    .delay-200 { animation-delay: 0.2s; }
    .delay-300 { animation-delay: 0.3s; }
    .delay-400 { animation-delay: 0.4s; }
    body.theme-transition {
      transition: background 0.4s, color 0.4s;
    }
    .logo-dark { display: none; }
    .logo-light { display: inline; }
    body.theme-dark .logo-dark { display: inline; }
    body.theme-dark .logo-light { display: none; }
  </style>
</body>
</html>
